[project]
name = "agentpay-backend"
version = "0.1.0"
description = "AgentPay backend: FastAPI gateway, deterministic policy engine, merchant revenue agent, and MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "razorpay>=2.0.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
